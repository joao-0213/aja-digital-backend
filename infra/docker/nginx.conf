resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 12m;

server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-AJA-Service-Token "";
    proxy_set_header X-AJA-Operator-Token "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_intercept_errors off;
    error_page 502 504 =503 @unavailable;

    location ^~ /api/v1/files {
        if ($upstream_service != "core:8081") { return 404; }
        client_max_body_size 0;
        proxy_pass http://$upstream_service$uri$is_args$args;
    }

    location ^~ /api/v1/ {
        if ($upstream_service = "") { return 404; }
        proxy_pass http://$upstream_service$uri$is_args$args;
    }

    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"API_UNAVAILABLE","message":"Serviço indisponível. Tente novamente.","requestId":"$request_id"}}';
    }

    location / {
        return 404;
    }
}
