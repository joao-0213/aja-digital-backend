plugins {
	id 'com.diffplug.spotless' version '8.4.0'
	id 'dev.detekt' version '2.0.0-alpha.3'
	id 'org.jetbrains.kotlin.jvm' version '2.3.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.21'
}

group = 'br.com.ajadigital'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'com.lemonappdev:konsist:0.17.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'tools.jackson.module:jackson-module-kotlin'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	 testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-rabbitmq'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testImplementation 'org.jetbrains.kotlin:kotlin-compiler-embeddable:2.3.21'
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def normativeOpenApi = [rootProject.file('../../docs/http/openapi.json'), rootProject.file('docs/http/openapi.json')].find { it.isFile() }
if (normativeOpenApi == null) throw new GradleException('docs/http/openapi.json is required to package Core public API docs')

tasks.named('processResources') {
	from(normativeOpenApi) {
		into 'META-INF/aja'
		rename { 'openapi.json' }
	}
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

allOpen {
	annotation 'jakarta.persistence.Entity'
	annotation 'jakarta.persistence.MappedSuperclass'
	annotation 'jakarta.persistence.Embeddable'
}

tasks.named('test') {
	useJUnitPlatform()
	dependsOn tasks.named('bootJar')
}

tasks.register('architectureAudit', Test) {
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	include '**/CoreProductionArchitectureAuditTest.class'
}

spotless {
	kotlin {
		target 'src/main/kotlin/**/*.kt'
		// Kotlin requires backticks around the architectural package segment `in`.
		ktlint('1.7.1').editorConfigOverride(['ktlint_code_style': 'intellij_idea', 'ktlint_standard_package-name': 'disabled'])
	}
}

detekt {
	autoCorrect = true
	buildUponDefaultConfig = true
	config.setFrom(file('detekt.yml'))
	source.setFrom(files('src/main/kotlin'))
}

tasks.named('detektTest') {
	enabled = false
}
