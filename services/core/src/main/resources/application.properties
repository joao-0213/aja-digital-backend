spring.application.name=core
server.port=${SERVER_PORT:8081}
spring.datasource.url=${CORE_DATABASE_URL:jdbc:postgresql://localhost:5432/aja?currentSchema=core}
spring.datasource.username=${CORE_DATABASE_USER:core}
spring.datasource.password=${CORE_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.flyway.schemas=core
spring.flyway.default-schema=core
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:aja}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.rabbit.enabled=true
app.version=${APP_VERSION:1}
core.outbox.encryption-key=${CORE_OUTBOX_ENCRYPTION_KEY}
core.internal.questions-token=${CORE_QUESTIONS_SERVICE_TOKEN}
aja.cookie.secure=${AJA_COOKIE_SECURE:false}


spring.datasource.hikari.connection-timeout=2000
spring.rabbitmq.connection-timeout=2000
