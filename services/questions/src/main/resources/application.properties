spring.application.name=questions
server.port=${SERVER_PORT:8082}
spring.datasource.url=${QUESTIONS_DATABASE_URL:jdbc:postgresql://localhost:5432/aja?currentSchema=questions}
spring.datasource.username=${QUESTIONS_DATABASE_USER:questions}
spring.datasource.password=${QUESTIONS_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=questions
spring.flyway.default-schema=questions
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true
app.version=${APP_VERSION:1}
questions.core.internal-session-url=${CORE_INTERNAL_SESSION_URL:http://localhost:8081/internal/v1/session}
questions.core.service-token=${CORE_QUESTIONS_SERVICE_TOKEN}
questions.core.public-api-url=${CORE_PUBLIC_API_URL:http://localhost:8081/api/v1}


spring.datasource.hikari.connection-timeout=2000
