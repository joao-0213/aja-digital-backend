spring.application.name=email
server.port=${SERVER_PORT:8083}
spring.datasource.url=${EMAIL_DATABASE_URL:jdbc:postgresql://localhost:5432/aja?currentSchema=email}
spring.datasource.username=${EMAIL_DATABASE_USER:email}
spring.datasource.password=${EMAIL_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=email
spring.flyway.default-schema=email
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:aja}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.rabbit.enabled=true
app.version=${APP_VERSION:1}


spring.datasource.hikari.connection-timeout=2000
spring.rabbitmq.connection-timeout=2000
